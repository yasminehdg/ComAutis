<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajouter une observation - ComAutiste</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .form-container {
            background: white;
            border-radius: 25px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 700px;
            overflow: hidden;
            animation: slideIn 0.6s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 40px;
            text-align: center;
            color: white;
        }

        .form-header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .form-header p {
            font-size: 16px;
            opacity: 0.9;
        }

        .form-body {
            padding: 40px;
        }

        .info-box {
            background: #e8f5e9;
            border-left: 4px solid #27ae60;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        .info-box p {
            color: #27ae60;
            font-size: 14px;
            margin: 0;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            color: #2c3e50;
            font-weight: 600;
            font-size: 15px;
        }

        .form-group label .required {
            color: #e74c3c;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #ecf0f1;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.3s;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 150px;
        }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 15px;
        }

        .checkbox-wrapper input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .checkbox-wrapper label {
            margin: 0;
            cursor: pointer;
            font-weight: normal;
        }

        .type-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
        }

        .type-option {
            padding: 15px;
            border: 2px solid #ecf0f1;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: white;
        }

        .type-option:hover {
            border-color: #667eea;
            transform: translateY(-2px);
        }

        .type-option.selected {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.1);
        }

        .type-option input[type="radio"] {
            display: none;
        }

        .type-icon {
            font-size: 28px;
            margin-bottom: 5px;
        }

        .type-label {
            font-size: 13px;
            color: #2c3e50;
            font-weight: 600;
        }

        .buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .btn {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            text-align: center;
            display: inline-block;
        }

        .btn-submit {
            background: linear-gradient(135deg, #27ae60 0%, #229954 100%);
            color: white;
            box-shadow: 0 8px 20px rgba(39, 174, 96, 0.3);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(39, 174, 96, 0.4);
        }

        .btn-cancel {
            background: #ecf0f1;
            color: #7f8c8d;
        }

        .btn-cancel:hover {
            background: #bdc3c7;
        }

        @media (max-width: 768px) {
            .form-body {
                padding: 30px 20px;
            }

            .buttons {
                flex-direction: column;
            }

            .type-options {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="form-container">
        <div class="form-header">
            <h1>📝 Nouvelle Observation</h1>
            <p>Ajouter une observation sur {{ enfant.prenom }}</p>
        </div>

        <div class="form-body">
            <div class="info-box">
                <p>💡 Les observations marquées comme visibles seront consultables par le parent</p>
            </div>

            {% if messages %}
            {% for message in messages %}
            <div style="padding: 15px; background: {% if message.tags == 'success' %}#d4edda{% elif message.tags == 'error' %}#f8d7da{% else %}#d1ecf1{% endif %}; border-radius: 10px; margin-bottom: 20px; color: #2c3e50;">
                {{ message }}
            </div>
            {% endfor %}
            {% endif %}

            <form method="POST">
                {% csrf_token %}

                <!-- TITRE -->
                <div class="form-group">
                    <label for="titre">Titre <span class="required">*</span></label>
                    <input type="text" id="titre" name="titre" placeholder="Ex: Excellente concentration aujourd'hui" required>
                </div>

                <!-- TYPE -->
                <div class="form-group">
                    <label>Type d'observation <span class="required">*</span></label>
                    <div class="type-options">
                        <div class="type-option" onclick="selectType(this, 'progres')">
                            <input type="radio" id="progres" name="type_observation" value="progres" required>
                            <label for="progres">
                                <div class="type-icon">📈</div>
                                <div class="type-label">Progrès</div>
                            </label>
                        </div>

                        <div class="type-option" onclick="selectType(this, 'difficulte')">
                            <input type="radio" id="difficulte" name="type_observation" value="difficulte">
                            <label for="difficulte">
                                <div class="type-icon">⚠️</div>
                                <div class="type-label">Difficulté</div>
                            </label>
                        </div>

                        <div class="type-option" onclick="selectType(this, 'comportement')">
                            <input type="radio" id="comportement" name="type_observation" value="comportement">
                            <label for="comportement">
                                <div class="type-icon">😊</div>
                                <div class="type-label">Comportement</div>
                            </label>
                        </div>

                        <div class="type-option" onclick="selectType(this, 'reussite')">
                            <input type="radio" id="reussite" name="type_observation" value="reussite">
                            <label for="reussite">
                                <div class="type-icon">🎉</div>
                                <div class="type-label">Réussite</div>
                            </label>
                        </div>

                        <div class="type-option" onclick="selectType(this, 'autre')">
                            <input type="radio" id="autre" name="type_observation" value="autre">
                            <label for="autre">
                                <div class="type-icon">📝</div>
                                <div class="type-label">Autre</div>
                            </label>
                        </div>
                    </div>
                </div>

                <!-- DESCRIPTION -->
                <div class="form-group">
                    <label for="description">Description détaillée <span class="required">*</span></label>
                    <textarea id="description" name="description" placeholder="Décrivez ce que vous avez observé..." required></textarea>
                </div>

                <!-- VISIBLE PARENT -->
                <div class="form-group">
                    <div class="checkbox-wrapper">
                        <input type="checkbox" id="visible_parent" name="visible_parent" checked>
                        <label for="visible_parent">👁️ Visible par le parent</label>
                    </div>
                </div>

                <!-- BUTTONS -->
                <div class="buttons">
                    <a href="/educateur/enfant/{{ enfant.id }}/" class="btn btn-cancel">Annuler</a>
                    <button type="submit" class="btn btn-submit">💾 Enregistrer</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function selectType(element, type) {
            // Retirer la sélection de tous
            document.querySelectorAll('.type-option').forEach(opt => {
                opt.classList.remove('selected');
            });
            
            // Sélectionner celui cliqué
            element.classList.add('selected');
            document.getElementById(type).checked = true;
        }

        // Sélectionner le premier par défaut
        document.addEventListener('DOMContentLoaded', function() {
            const firstOption = document.querySelector('.type-option');
            if (firstOption) {
                selectType(firstOption, 'progres');
            }
        });
    </script>
</body>
</html>
