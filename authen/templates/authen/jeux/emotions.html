<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="enfant-id" content="{{ enfant.id }}">
    <title>😊 Les Émotions - ComAutiste</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Comic Sans MS', 'Arial Rounded MT Bold', sans-serif;
            background: linear-gradient(135deg, #ffeaa7 0%, #74b9ff 100%);
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }
        .container { max-width: 1100px; margin: 0 auto; }
        .header {
            background: white;
            padding: 30px;
            border-radius: 25px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }
        .header h1 { font-size: 48px; color: #2c3e50; margin-bottom: 10px; }
        .game-area {
            background: white;
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
            margin-bottom: 25px;
            min-height: 600px;
        }
        .question-text { font-size: 38px; color: #2c3e50; font-weight: bold; margin-bottom: 30px; text-align: center; }
        .face-container { display: flex; justify-content: center; margin: 40px 0; }
        .face-image {
            width: 350px;
            height: 350px;
            border-radius: 30px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
            object-fit: cover;
            border: 8px solid white;
        }
        .emotions-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin: 40px 0;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }
        .emotion-card {
            background: #f8f9fa;
            border-radius: 20px;
            padding: 25px 15px;
            cursor: pointer;
            transition: all 0.4s;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            border: 4px solid transparent;
            text-align: center;
        }
        .emotion-card:hover { transform: translateY(-10px) scale(1.05); box-shadow: 0 15px 40px rgba(0,0,0,0.25); }
        .emotion-emoji { font-size: 70px; margin-bottom: 10px; }
        .emotion-name { font-size: 22px; font-weight: bold; color: #2c3e50; }
        .emotion-card.correct {
            border-color: #27ae60;
            background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%);
            animation: correctBounce 0.6s ease-out;
        }
        @keyframes correctBounce {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.15) rotate(5deg); }
            50% { transform: scale(1.2); }
            75% { transform: scale(1.15) rotate(-5deg); }
        }
        .emotion-card.wrong { animation: wrongShake 0.6s ease-out; border-color: #e74c3c; background: #ffebee; }
        @keyframes wrongShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-15px); }
            75% { transform: translateX(15px); }
        }
        .feedback { text-align: center; margin-top: 30px; font-size: 36px; font-weight: bold; min-height: 60px; }
        .feedback.correct { color: #27ae60; }
        .feedback.wrong { color: #e74c3c; }
        .score-display {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 20px;
            text-align: center;
            margin-bottom: 25px;
        }
        .stars { font-size: 50px; margin: 10px 0; }
        .controls { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; }
        .btn {
            padding: 15px 40px;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            font-family: 'Comic Sans MS', sans-serif;
        }
        .btn-next { background: linear-gradient(135deg, #ff6b9d 0%, #ff8e53 100%); color: white; }
        .btn-back { background: white; color: #2c3e50; border: 3px solid #2c3e50; }
        .victory-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }
        .victory-content {
            background: white;
            padding: 50px;
            border-radius: 30px;
            text-align: center;
            max-width: 500px;
        }
        .victory-emoji { font-size: 120px; margin-bottom: 20px; }
        .victory-content h2 { font-size: 48px; color: #27ae60; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>😊 Apprendre les Émotions 😊</h1>
            <p style="font-size: 22px; color: #7f8c8d;">Regarde le visage et trouve l'émotion !</p>
        </div>
        <div class="score-display">
            <h3 style="font-size: 24px;">🌟 Ton Score 🌟</h3>
            <div class="stars" id="stars">⭐⭐⭐</div>
            <p style="font-size: 22px; margin-top: 10px;">
                <span id="correct-count">0</span> bonnes réponses sur <span id="total-count">0</span>
            </p>
        </div>
        <div class="game-area">
            <div class="question-text">Quelle émotion vois-tu ?</div>
            <div class="face-container">
                <img id="face-image" class="face-image" src="" alt="Visage émotion">
            </div>
            <div class="emotions-container" id="emotions-container"></div>
            <div class="feedback" id="feedback"></div>
        </div>
        <div class="controls">
            <button class="btn btn-next" id="next-btn" onclick="nextQuestion()" style="display: none;">➡️ Question Suivante</button>
            <button class="btn btn-back" onclick="window.location.href='/enfant/{{ enfant.id }}/jeux/'">⬅️ Retour aux Jeux</button>
        </div>
    </div>
    <div class="victory-modal" id="victory-modal">
        <div class="victory-content">
            <div class="victory-emoji">🎉</div>
            <h2>Bravo Champion !</h2>
            <p style="font-size: 24px; color: #7f8c8d; margin: 20px 0;">Tu reconnais toutes les émotions !</p>
            <div class="stars" style="font-size: 70px; margin: 30px 0;">⭐⭐⭐</div>
            <button class="btn btn-next" onclick="restartGame()">🔄 Recommencer</button>
        </div>
    </div>

    <script>
    (function() {
        'use strict';
        const urlParts = window.location.pathname.split('/');
        let enfantId = null, jeuName = 'emotions';
        const enfantIndex = urlParts.indexOf('enfant');
        if (enfantIndex !== -1 && urlParts[enfantIndex + 1]) enfantId = urlParts[enfantIndex + 1];
        if (!enfantId) {
            const metaEnfant = document.querySelector('meta[name="enfant-id"]');
            if (metaEnfant) enfantId = metaEnfant.content;
        }
        if (!enfantId || !jeuName) { console.log('ℹ️ Tracking désactivé'); return; }
        console.log('🎮 Auto-tracking activé:', jeuName, 'pour enfant', enfantId);
        let activiteId = null, startTime = Date.now(), hasStarted = false;
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
        async function startActivity() {
            if (hasStarted) return;
            hasStarted = true;
            try {
                const response = await fetch('/api/start-activity/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken') },
                    body: JSON.stringify({ enfant_id: enfantId, jeu: jeuName })
                });
                const data = await response.json();
                if (data.success) {
                    activiteId = data.activite_id;
                    console.log('✅ Activité démarrée automatiquement, ID:', activiteId);
                }
            } catch (error) { console.error('❌ Erreur démarrage:', error); }
        }
        async function endActivity() {
            if (!activiteId) return;
            try {
                const durationMinutes = Math.round((Date.now() - startTime) / 1000 / 60);
                const reussi = durationMinutes >= 2;
                const score = reussi ? 75 : 50;
                await fetch('/api/end-activity/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken') },
                    body: JSON.stringify({ activite_id: activiteId, score: score, reussi: reussi })
                });
            } catch (error) { console.error('❌ Erreur fin activité:', error); }
        }
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', startActivity);
        } else { startActivity(); }
        window.addEventListener('beforeunload', function() {
            if (activiteId) {
                const durationMinutes = Math.round((Date.now() - startTime) / 1000 / 60);
                navigator.sendBeacon('/api/end-activity/', JSON.stringify({
                    activite_id: activiteId, score: durationMinutes >= 2 ? 75 : 50, reussi: durationMinutes >= 2
                }));
            }
        });
    })();
    </script>

    <script>
        let currentEmotion = null, correctAnswers = 0, totalQuestions = 0, questionCount = 0;
        const maxQuestions = 12;
        let answered = false;

        const emotionsDatabase = {
            joyeux: { name: 'Joyeux', emoji: '😊', images: [
                '/static/images/jeux/emotions/joyeux_1.png',
                '/static/images/jeux/emotions/joyeux_2.png',
                '/static/images/jeux/emotions/joyeux_3.png'
            ]},
            triste: { name: 'Triste', emoji: '😢', images: [
                '/static/images/jeux/emotions/triste_1.png',
                '/static/images/jeux/emotions/triste_2.png'
            ]},
            colere: { name: 'En colère', emoji: '😠', images: [
                '/static/images/jeux/emotions/colere_1.png',
                '/static/images/jeux/emotions/colere_2.png'
            ]},
            surpris: { name: 'Surpris', emoji: '😮', images: [
                '/static/images/jeux/emotions/surpris_1.png'
            ]},
            peur: { name: 'Peur', emoji: '😰', images: [
                '/static/images/jeux/emotions/peur_1.png'
            ]},
            calme: { name: 'Calme', emoji: '😐', images: [
                '/static/images/jeux/emotions/calme_1.png'
            ]}
        };

        function generateQuestion() {
            answered = false; questionCount++; totalQuestions++;
            document.getElementById('total-count').textContent = totalQuestions;
            document.getElementById('feedback').textContent = '';
            document.getElementById('next-btn').style.display = 'none';
            
            const emotionKeys = Object.keys(emotionsDatabase);
            const randomEmotionKey = emotionKeys[Math.floor(Math.random() * emotionKeys.length)];
            currentEmotion = emotionsDatabase[randomEmotionKey];
            
            const randomImage = currentEmotion.images[Math.floor(Math.random() * currentEmotion.images.length)];
            document.getElementById('face-image').src = randomImage;
            document.getElementById('face-image').onerror = function() {
                this.src = 'https://via.placeholder.com/350?text=' + currentEmotion.name;
            };
            
            generateChoices();
        }

        function generateChoices() {
            const container = document.getElementById('emotions-container');
            container.innerHTML = '';
            const wrongEmotions = [];
            const emotionKeys = Object.keys(emotionsDatabase);
            const otherEmotions = emotionKeys.filter(key => emotionsDatabase[key] !== currentEmotion);
            const shuffled = otherEmotions.sort(() => Math.random() - 0.5).slice(0, 3);
            shuffled.forEach(key => wrongEmotions.push(emotionsDatabase[key]));
            const allEmotions = [currentEmotion, ...wrongEmotions].sort(() => Math.random() - 0.5);
            allEmotions.forEach(emotion => {
                const card = document.createElement('div');
                card.className = 'emotion-card';
                card.innerHTML = `<div class="emotion-emoji">${emotion.emoji}</div><div class="emotion-name">${emotion.name}</div>`;
                card.onclick = () => checkAnswer(emotion === currentEmotion, card);
                container.appendChild(card);
            });
        }

        function checkAnswer(isCorrect, card) {
            if (answered) return;
            answered = true;
            const allCards = document.querySelectorAll('.emotion-card');
            allCards.forEach(c => c.style.pointerEvents = 'none');
            const feedback = document.getElementById('feedback');
            if (isCorrect) {
                card.classList.add('correct');
                correctAnswers++;
                document.getElementById('correct-count').textContent = correctAnswers;
                feedback.textContent = `Bravo ! C'est bien ${currentEmotion.name.toUpperCase()} ! ${currentEmotion.emoji}`;
                feedback.className = 'feedback correct';
                updateStars();
                setTimeout(() => {
                    if (questionCount >= maxQuestions) { showVictory(); } 
                    else { document.getElementById('next-btn').style.display = 'inline-block'; }
                }, 1500);
            } else {
                card.classList.add('wrong');
                feedback.textContent = "Regarde bien le visage ! Essaie encore ! 💪";
                feedback.className = 'feedback wrong';
                setTimeout(() => {
                    card.classList.remove('wrong');
                    allCards.forEach(c => c.style.pointerEvents = 'auto');
                    answered = false;
                    feedback.textContent = '';
                }, 1000);
            }
        }

        function nextQuestion() { if (questionCount >= maxQuestions) { showVictory(); } else { generateQuestion(); } }

        function updateStars() {
            const percentage = (correctAnswers / totalQuestions) * 100;
            let stars = '⭐⭐⭐';
            if (percentage < 60) stars = '⭐';
            else if (percentage < 80) stars = '⭐⭐';
            document.getElementById('stars').textContent = stars;
        }

        function showVictory() { document.getElementById('victory-modal').style.display = 'flex'; }

        function restartGame() {
            correctAnswers = 0; totalQuestions = 0; questionCount = 0;
            document.getElementById('correct-count').textContent = '0';
            document.getElementById('total-count').textContent = '0';
            document.getElementById('stars').textContent = '⭐⭐⭐';
            document.getElementById('victory-modal').style.display = 'none';
            generateQuestion();
        }

        generateQuestion();
    </script>
</body>
</html>
